<header class="site-header">
  <div class="wrap site-header-inner">
    <div class="brand">
      <a class="site-title" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
      <p class="affiliation">
        {{ site.Params.affiliation | default "A publication of the" }}
        <a href="https://rrchnm.org">
          <img src="{{ "images/rrchnm-small.png" | relURL }}" alt="" width="16" height="16">
          <span>Roy Rosenzweig Center for History and New Media</span>
        </a>
      </p>
    </div>
    <nav class="site-nav" aria-label="Main">
      <ul>
        {{ range site.Menus.main }}
        <li><a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ else if $.HasMenuCurrent "main" . }} aria-current="true"{{ end }}>{{ .Name }}</a></li>
        {{ end }}
        {{ with site.GetPage "/search" }}
        <li>
          <a class="search-link" href="{{ .RelPermalink }}"{{ if eq $.RelPermalink .RelPermalink }} aria-current="page"{{ end }}>
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            {{ .Title }}
          </a>
        </li>
        {{ end }}
      </ul>
    </nav>
  </div>
</header>
